<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" width="1020" height="510"><rect width="1020" height="510" fill="#fff"/><style>text{font:15px Arial,sans-serif;fill:#203449}.heading{font:bold 23px Arial}.node{fill:#eaf5fa;stroke:#2d7185;stroke-width:2;rx:12}.ai{fill:#dcf4e5;stroke:#248658}.sim{fill:#f8e9fc;stroke:#8951a4}.label{font:bold 16px Arial}.sub{font:12px Arial;fill:#44556b}.link{stroke:#425770;stroke-width:2;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#425770"/></marker></defs><text x="30" y="35" class="heading">Adaptive Dodge — system architecture</text><rect class="node" x="28" y="85" width="200" height="75"/><text class="label" x="48" y="112">Player and controls</text><text class="sub" x="48" y="137">Keyboard · DDA toggle</text><rect class="node" x="300" y="85" width="190" height="75"/><text class="label" x="320" y="112">Game / Canvas</text><text class="sub" x="320" y="137">Movement · obstacles</text><rect class="node" x="565" y="85" width="200" height="75"/><text class="label" x="580" y="112">Performance tracker</text><text class="sub" x="580" y="137">Hits · 10-second windows</text><rect class="node ai" x="565" y="260" width="200" height="85"/><text class="label" x="587" y="290">Rule-based DDA</text><text class="sub" x="587" y="312">Thresholds · levels 1–5</text><rect class="node" x="300" y="260" width="190" height="85"/><text class="label" x="320" y="289">Game parameters</text><text class="sub" x="320" y="315">Speed · spawn rate</text><rect class="node" x="28" y="260" width="200" height="85"/><text class="label" x="48" y="288">Visible feedback</text><text class="sub" x="48" y="313">Level · explanations</text><rect class="node sim" x="805" y="260" width="180" height="85"/><text class="label" x="822" y="289">Simulation input</text><text class="sub" x="822" y="314">Synthetic test windows</text><path class="link" d="M228 123 H300"/><path class="link" d="M490 123 H565"/><path class="link" d="M665 160 V260"/><path class="link" d="M565 300 H490"/><path class="link" d="M395 260 V160"/><path class="link" d="M565 323 H228"/><path class="link" d="M130 260 V160"/><path class="link" d="M805 300 H765"/><text x="30" y="435" class="sub">Blue: implemented gameplay, tracker and feedback. Green: implemented adaptive rules. Purple: simulated inputs for testing.</text><text x="30" y="464" class="sub">Flow: player action → game events → performance → controller → game parameters and feedback → player.</text></svg>