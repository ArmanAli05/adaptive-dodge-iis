<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460"><rect width="1080" height="460" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#142238}.heading{font-size:22px;font-weight:bold}.name{font-size:17px;font-weight:bold}.body{font-size:14px}.detail{font-size:13px;fill:#51627c}.panel{fill:#e8f1fa;stroke:#7396b5;stroke-width:2}.arena{fill:#142238}.player{fill:#38bdf8}.obstacle{fill:#fb7185}</style><text class="heading" x="24" y="35">Adaptive Dodge — illustrated interaction scenarios (simulated)</text><g transform="translate(20 65)"><rect class="panel" rx="12" width="335" height="365"/><text class="name" x="20" y="30">1. Player struggles</text><rect class="arena" x="22" y="45" width="290" height="200" rx="8"/><rect class="obstacle" x="70" y="140" width="35" height="17" rx="3"/><rect class="obstacle" x="160" y="180" width="46" height="17" rx="3"/><rect class="obstacle" x="242" y="120" width="46" height="17" rx="3"/><rect class="player" x="157" y="213" width="45" height="14" rx="4"/><text class="body" x="22" y="272">Action: two collisions in 10 seconds</text><text class="body" x="22" y="295">Response: level 2 → 1</text><text class="detail" x="22" y="320">Feedback: reason shown in decision log</text><text class="detail" x="22" y="344">SIMULATED controller input</text></g><g transform="translate(373 65)"><rect class="panel" rx="12" width="335" height="365"/><text class="name" x="20" y="30">2. Player succeeds</text><rect class="arena" x="22" y="45" width="290" height="200" rx="8"/><rect class="obstacle" x="65" y="135" width="33" height="17" rx="3"/><rect class="obstacle" x="232" y="120" width="42" height="17" rx="3"/><rect class="player" x="156" y="213" width="45" height="14" rx="4"/><text class="body" x="22" y="272">Action: two clean 10-second windows</text><text class="body" x="22" y="295">Response: level 2 → 3</text><text class="detail" x="22" y="320">Feedback: increase explained to player</text><text class="detail" x="22" y="344">SIMULATED controller input</text></g><g transform="translate(726 65)"><rect class="panel" rx="12" width="335" height="365"/><text class="name" x="20" y="30">3. Player chooses control</text><rect x="22" y="55" width="290" height="194" rx="8" fill="#fff" stroke="#9bb3ca"/><text class="body" x="45" y="95">☐ Enable automatic DDA</text><text class="body" x="45" y="140">Fixed difficulty: level 4</text><rect x="45" y="159" width="225" height="50" rx="7" fill="#dceef9"/><text class="detail" x="55" y="186">Automatic adaptation disabled</text><text class="body" x="22" y="272">Action: turn off DDA and choose 4</text><text class="body" x="22" y="295">Response: level stays fixed at 4</text><text class="detail" x="22" y="320">Feedback: manual-mode confirmation</text><text class="detail" x="22" y="344">Illustrative walkthrough, not a user study</text></g></svg>